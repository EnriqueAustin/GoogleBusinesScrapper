version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: leadlens_postgres
    environment:
      POSTGRES_USER: scraper_user
      POSTGRES_PASSWORD: scraper_password
      POSTGRES_DB: leadlens
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: leadlens_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
